title: Citrix/NetScaler SD-WAN installpatch.cgi Command Injection Attempt (CVE-2019-12991)
id: 76b3e5e2-0de0-56d3-ba3d-053656c1c894
status: experimental
description: 'Detects HTTP requests to the Citrix SD-WAN /cgi-bin/installpatch.cgi endpoint containing the unvalidated ''installfile''
  parameter used for root command injection, and the chained unauthenticated SQL injection endpoint used to forge the swc-token.

  DRAFT written by claude-opus-5 from public text for CVE-2019-12991. Not tested against attack or benign logs. Review before
  deploying; retire after patching.

  Review (2026-10-06): dropped the branch matching any patch install; kept the metacharacter and auth-bypass branches.'
references:
- https://nvd.nist.gov/vuln/detail/CVE-2019-12991
author: exposure_to_sigma draft (claude-opus-5)
date: '2026-10-06'
tags:
- cve.2019-12991
logsource:
  category: proxy
detection:
  selection_metachar:
    c-uri|contains:
    - installfile=`
    - installfile=%60
  selection_authbypass:
    c-uri|contains|all:
    - /sdwan/nitro/v1/config/get_package_file
    - action=file_download
  condition: selection_metachar or selection_authbypass
falsepositives:
- Legitimate administrator patch installation through the SD-WAN management UI hitting installpatch.cgi (should not contain
  shell metacharacters)
- Authorized vulnerability scanning of the appliance
level: high
