title: Ivanti Connect Secure Authentication Bypass / Command Injection Endpoint Access (CVE-2023-46805, CVE-2024-21887)
id: 85ad2278-a54c-5693-9cff-f2d22bc3f5cf
status: experimental
description: 'Detects HTTP requests to Ivanti Connect Secure / Policy Secure endpoints associated with CVE-2023-46805 authentication
  bypass and the chained CVE-2024-21887 command injection: the rest-userrole1 web-bookmarks endpoint returning 403, the totp/user-backup-code
  and cav/client/status traversal bypass paths, and the cloud-server-test-connection / license keys-status injection URIs
  returning 200. Translated from the Splunk analytics ''Access to Vulnerable Ivanti Connect Secure Bookmark Endpoint'' and
  ''Ivanti Connect Secure Command Injection Attempts'' plus the Nuclei CVE-2023-46805 scanner check.

  Translated from other:detections access_to_vulnerable_ivanti_connect_secure_bookmark_endpoint.yml (splunk-spl); keep that
  project''s license notice when redistributing.

  DRAFT written by claude-opus-5 from public text for CVE-2023-46805. Not tested against attack or benign logs. Review before
  deploying; retire after patching.

  Review (2026-10-06): approved as drafted.'
references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46805
author: exposure_to_sigma draft (claude-opus-5)
date: '2026-10-06'
tags:
- cve.2023-46805
logsource:
  category: webserver
detection:
  selection_bookmark:
    cs-uri-stem|contains:
    - /api/v1/configuration/users/user-roles/user-role/rest-userrole1/web/web-bookmarks/bookmark
    cs-method:
    - GET
    sc-status:
    - 403
  selection_cmdinject:
    cs-uri-stem|contains:
    - /api/v1/totp/user-backup-code/../../system/maintenance/archiving/cloud-server-test-connection
    - /api/v1/totp/user-backup-code/../../license/keys-status/
    cs-method:
    - POST
    - GET
    sc-status:
    - 200
  selection_authbypass_probe:
    cs-uri-stem|contains:
    - /api/v1/totp/user-backup-code/../../system/system-information
    - /api/v1/cav/client/status/../../admin/options
    cs-method:
    - GET
    sc-status:
    - 200
  condition: 1 of selection*
falsepositives:
- Authorized vulnerability scanning or mitigation-verification of Ivanti gateways using the same probe URIs
- Status-code filtering may miss or misfire where the URI path is IP-restricted or externally blocked, as noted in the source
  analytics
level: high
