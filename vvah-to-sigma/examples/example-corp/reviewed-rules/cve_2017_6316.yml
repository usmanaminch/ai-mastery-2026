title: Citrix NetScaler SD-WAN / CloudBridge CGISESSID Cookie Command Injection (CVE-2017-6316)
id: 0909f98d-95f6-53ef-a65d-df205fafc69c
status: experimental
description: 'Detects exploitation attempts against Citrix NetScaler SD-WAN / CloudBridge where shell commands are embedded
  in the CGISESSID or CAKEPHP session cookie, as used by the public Metasploit module posting action=logout to /global_data/.

  DRAFT written by claude-opus-5 from public text for CVE-2017-6316. Not tested against attack or benign logs. Review before
  deploying; retire after patching.

  Review (2026-10-06): fires only where the proxy logs cookies.'
references:
- https://nvd.nist.gov/vuln/detail/CVE-2017-6316
author: exposure_to_sigma draft (claude-opus-5)
date: '2026-10-06'
tags:
- cve.2017-6316
logsource:
  category: proxy
detection:
  selection_cookie:
    cs-cookie|contains:
    - CGISESSID=
    - CAKEPHP=
  selection_injection:
    cs-cookie|contains:
    - '`'
    - /tmp/n
    - /tmp/m
    - chmod 755
    - echo -e
  condition: selection_cookie and selection_injection
falsepositives:
- Session cookies that legitimately contain backtick or similar characters (rare, cookie values are normally hex session IDs)
- Authorized penetration testing of the SD-WAN management interface
level: high
